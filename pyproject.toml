[tool.black]
line-length = 130

[tool.isort]
profile = "black"
line_length = 130

[tool.flake8]
max-line-length = 130
extend-ignore = "E203, W503"

[tool.mypy]
python_version = 3.11
warn_return_any = true
warn_unused_configs = true
disallow_untyped_calls = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.pre_commit]
version = "2.15.0"
hooks = ["black", "isort", "flake8"]
